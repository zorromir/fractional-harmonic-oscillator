[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fractional-harmonic-oscillator"
version = "0.1.0"
description = "Revised code and computational examples for a 2025 mathematics thesis"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name="Kelvin Schouten"}]
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7", "mpmath>=1.3"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
